<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#EAB308" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// DARMOSHARK</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Solid Shell 58g PAW3395</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <ellipse cx="400" cy="620" rx="155" ry="22" fill="#000000" fill-opacity="0.12" filter="blur(7px)" />

      <!-- Large Medium Claw Chassis (Matte Black) -->
      <path d="M 400 160 C 310 160, 265 230, 265 385 C 265 520, 310 600, 400 600 C 490 600, 535 520, 535 385 C 535 230, 490 160, 400 160 Z"
            fill="#18181B" stroke="#27272A" stroke-width="3" />

      <!-- Clicks Split -->
      <path d="M 400 160 L 400 325" stroke="#09090B" stroke-width="4" />
      <path d="M 320 290 Q 400 325 480 290" stroke="#09090B" stroke-width="3" fill="none" />

      <!-- Gold Scroll Wheel / TTC Gold Encoder Accent -->
      <rect x="388" y="215" width="24" height="60" rx="8" fill="#09090B" stroke="#EAB308" stroke-width="3" />
      <rect x="394" y="235" width="12" height="20" rx="3" fill="#EAB308" />

      <!-- Darmoshark Shark Fin Logo -->
      <path d="M 390 460 Q 400 440 415 450 Q 405 465 390 460 Z" fill="#EAB308" />
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // DARMOSHARK M3 4K</text>
  </svg>