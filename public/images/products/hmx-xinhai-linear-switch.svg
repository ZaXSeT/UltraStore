<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#F472B6" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// HMX</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Clacky Factory Lubed MX Switch</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <ellipse cx="400" cy="620" rx="140" ry="20" fill="#000000" fill-opacity="0.1" filter="blur(6px)" />

      <!-- Switch Bottom Housing (Translucent Blue/Cyan) -->
      <path d="M 260 380 L 540 380 L 510 520 L 290 520 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="4" />

      <!-- Contact Pins -->
      <rect x="330" y="520" width="8" height="60" rx="2" fill="#E2E8F0" />
      <rect x="460" y="520" width="8" height="60" rx="2" fill="#E2E8F0" />
      <rect x="395" y="520" width="10" height="75" rx="3" fill="#0284C7" />

      <!-- Switch Top Housing (Crystal Clear) -->
      <path d="M 280 260 L 520 260 L 540 380 L 260 380 Z" fill="#E0F2FE" fill-opacity="0.75" stroke="#38BDF8" stroke-width="4" />

      <!-- POM Stem (Pastel Pink) -->
      <!-- Center Stem Cross -->
      <rect x="382" y="170" width="36" height="120" rx="4" fill="#F472B6" stroke="#DB2777" stroke-width="3" />
      <rect x="350" y="195" width="100" height="34" rx="4" fill="#F472B6" stroke="#DB2777" stroke-width="3" />

      <!-- Internal Spring Visible through Top -->
      <g stroke="#94A3B8" stroke-width="3" fill="none">
        <path d="M 380 320 Q 400 330 420 320" />
        <path d="M 380 340 Q 400 350 420 340" />
        <path d="M 380 360 Q 400 370 420 360" />
      </g>
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // XINHAI 45G LINEAR SWITCHES</text>
  </svg>