<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#2DD4BF" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// WLMOUSE</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Magnesium 39g / 8K Polling</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Mouse Body Outline -->
      <defs>
        <linearGradient id="magnesiumShine" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#334155" />
          <stop offset="40%" stop-color="#1E293B" />
          <stop offset="70%" stop-color="#0F172A" />
          <stop offset="100%" stop-color="#020617" />
        </linearGradient>
        <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Shadow -->
      <ellipse cx="400" cy="620" rx="160" ry="24" fill="#000000" fill-opacity="0.12" filter="blur(8px)" />

      <!-- Main Magnesium Shell -->
      <path d="M 400 160 C 310 160, 270 230, 270 380 C 270 510, 310 590, 400 590 C 490 590, 530 510, 530 380 C 530 230, 490 160, 400 160 Z"
            fill="url(#magnesiumShine)" stroke="#475569" stroke-width="4" />

      <!-- Split Clicks -->
      <path d="M 400 165 L 400 320" stroke="#0F172A" stroke-width="5" />
      <path d="M 330 280 L 400 320 L 470 280" stroke="#0F172A" stroke-width="4" fill="none" />

      <!-- Magnesium Hexagonal Cutouts Pattern -->
      <g stroke="#2DD4BF" stroke-width="2" fill="none" opacity="0.85">
        <!-- Center column hexes -->
        <polygon points="400,350 415,360 415,380 400,390 385,380 385,360" />
        <polygon points="400,405 415,415 415,435 400,445 385,435 385,415" />
        <polygon points="400,460 415,470 415,490 400,500 385,490 385,470" />
        <polygon points="400,515 415,525 415,545 400,555 385,545 385,525" />

        <!-- Left column hexes -->
        <polygon points="365,378 380,388 380,408 365,418 350,408 350,388" />
        <polygon points="365,433 380,443 380,463 365,473 350,463 350,443" />
        <polygon points="365,488 380,498 380,518 365,528 350,518 350,498" />

        <!-- Right column hexes -->
        <polygon points="435,378 450,388 450,408 435,418 420,408 420,388" />
        <polygon points="435,433 450,443 450,463 435,473 420,463 420,443" />
        <polygon points="435,488 450,498 450,518 435,528 420,518 420,498" />
      </g>

      <!-- Scroll Wheel with Metallic Rim -->
      <rect x="388" y="210" width="24" height="60" rx="8" fill="#020617" stroke="#2DD4BF" stroke-width="2.5" />
      <line x1="392" y1="230" x2="408" y2="230" stroke="#2DD4BF" stroke-width="2" />
      <line x1="392" y1="245" x2="408" y2="245" stroke="#2DD4BF" stroke-width="2" />

      <!-- Side Buttons -->
      <rect x="264" y="320" width="8" height="35" rx="3" fill="#2DD4BF" />
      <rect x="264" y="365" width="8" height="35" rx="3" fill="#2DD4BF" />
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // BEAST X MAGNESIUM</text>
  </svg>