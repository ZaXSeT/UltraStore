<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#F43F5E" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// X-RAYPAD</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Hybrid Amundsen Texture</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <rect x="160" y="550" width="480" height="30" rx="12" fill="#000000" fill-opacity="0.08" filter="blur(8px)" />

      <!-- Pad Edge Stitching -->
      <rect x="150" y="210" width="500" height="380" rx="16" fill="#0F172A" stroke="#E11D48" stroke-width="4" stroke-dasharray="8 4" />

      <!-- Surface Base -->
      <rect x="158" y="218" width="484" height="364" rx="10" fill="#18181B" />

      <!-- Sakura Branches & Blossoms Graphic -->
      <path d="M 180 500 Q 280 420 380 450 T 560 300" stroke="#4C0519" stroke-width="12" stroke-linecap="round" fill="none" />
      <path d="M 380 450 Q 420 380 460 360" stroke="#4C0519" stroke-width="8" stroke-linecap="round" fill="none" />

      <!-- Sakura Petals -->
      <g fill="#FB7185">
        <circle cx="560" cy="300" r="14" />
        <circle cx="580" cy="315" r="12" />
        <circle cx="550" cy="325" r="10" />
        <circle cx="460" cy="360" r="12" />
        <circle cx="480" cy="350" r="10" />
        <circle cx="380" cy="450" r="14" />
        <circle cx="360" cy="435" r="12" />
        <circle cx="280" cy="420" r="10" />
      </g>
      <g fill="#FFE4E6">
        <circle cx="560" cy="300" r="6" />
        <circle cx="460" cy="360" r="5" />
        <circle cx="380" cy="450" r="6" />
      </g>

      <!-- Floating Petals -->
      <ellipse cx="260" cy="320" rx="8" ry="16" transform="rotate(35 260 320)" fill="#FDA4AF" />
      <ellipse cx="340" cy="260" rx="6" ry="12" transform="rotate(-25 340 260)" fill="#FDA4AF" />
      <ellipse cx="480" cy="240" rx="7" ry="14" transform="rotate(50 480 240)" fill="#FDA4AF" />
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // AQUA CONTROL II SAKURA</text>
  </svg>