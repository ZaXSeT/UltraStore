<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#3B82F6" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// LOGITECH G</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">HERO 2 32K DPI Optical-Mechanical</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <ellipse cx="400" cy="620" rx="150" ry="22" fill="#000000" fill-opacity="0.12" filter="blur(7px)" />

      <!-- Minimalist Smooth Black Shell -->
      <path d="M 400 165 C 315 165, 275 230, 275 385 C 275 510, 315 590, 400 590 C 485 590, 525 510, 525 385 C 525 230, 485 165, 400 165 Z"
            fill="#09090B" stroke="#27272A" stroke-width="3" />

      <!-- Clicks Split -->
      <path d="M 400 165 L 400 325" stroke="#18181B" stroke-width="4" />
      <path d="M 330 290 Q 400 325 470 290" stroke="#18181B" stroke-width="3" fill="none" />

      <!-- Minimalist Scroll Wheel -->
      <rect x="388" y="215" width="24" height="60" rx="8" fill="#18181B" stroke="#52525B" stroke-width="2.5" />
      <line x1="392" y1="235" x2="408" y2="235" stroke="#71717A" stroke-width="2" />
      <line x1="392" y1="250" x2="408" y2="250" stroke="#71717A" stroke-width="2" />

      <!-- Iconic Logitech G Logo (Center Palm) -->
      <circle cx="400" cy="460" r="18" fill="none" stroke="#FFFFFF" stroke-width="4" />
      <rect x="400" y="456" width="16" height="8" fill="#FFFFFF" />
      <rect x="396" y="440" width="16" height="10" fill="#09090B" />
      <text x="400" y="525" fill="#71717A" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">SUPERLIGHT</text>
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // PRO X SUPERLIGHT 2</text>
  </svg>