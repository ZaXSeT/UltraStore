<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#06B6D4" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// LAMZU</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Cloud White 45g Ultralight</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <ellipse cx="400" cy="620" rx="150" ry="22" fill="#000000" fill-opacity="0.08" filter="blur(6px)" />

      <!-- Minimalist Ergonomic Shell (Cloud White) -->
      <path d="M 400 170 C 315 170, 280 235, 280 380 C 280 505, 320 585, 400 585 C 480 585, 520 505, 520 380 C 520 235, 485 170, 400 170 Z"
            fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3.5" />

      <!-- Subtle Contours -->
      <path d="M 400 170 L 400 325" stroke="#E2E8F0" stroke-width="3" />
      <path d="M 335 290 Q 400 330 465 290" stroke="#E2E8F0" stroke-width="2" fill="none" />

      <!-- Scroll Wheel with Cyan Accent -->
      <rect x="388" y="215" width="24" height="60" rx="8" fill="#F8FAFC" stroke="#06B6D4" stroke-width="3" />
      <rect x="394" y="235" width="12" height="20" rx="4" fill="#06B6D4" />

      <!-- Lamzu Signature Cat Face / Logo Subtle -->
      <circle cx="400" cy="460" r="14" fill="#F1F5F9" />
      <polygon points="388,448 396,456 388,456" fill="#06B6D4" />
      <polygon points="412,448 404,456 412,456" fill="#06B6D4" />
      <circle cx="395" cy="462" r="2" fill="#0F172A" />
      <circle cx="405" cy="462" r="2" fill="#0F172A" />
      <path d="M 397 467 Q 400 469 403 467" stroke="#0F172A" stroke-width="1.5" fill="none" />
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // MAYA 4K WIRELESS</text>
  </svg>