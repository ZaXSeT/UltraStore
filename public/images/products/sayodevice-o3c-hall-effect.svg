<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#0EA5E9" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// SAYODEVICE</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">3-Key Rapid Trigger osu! Keypad</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <rect x="220" y="570" width="360" height="30" rx="16" fill="#000000" fill-opacity="0.12" filter="blur(8px)" />

      <!-- CNC Aluminum Enclosure -->
      <rect x="200" y="230" width="400" height="350" rx="24" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
      <rect x="215" y="245" width="370" height="320" rx="16" fill="#020617" />

      <!-- 0.96 inch Color IPS Screen -->
      <rect x="250" y="275" width="300" height="85" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
      <text x="400" y="315" fill="#38BDF8" font-size="16" font-family="monospace" font-weight="bold" text-anchor="middle">0.02ms RT</text>
      <text x="400" y="340" fill="#94A3B8" font-size="11" font-family="monospace" text-anchor="middle">SAYODEVICE // 8000Hz</text>

      <!-- 3 Keycaps with Hall Effect Switches -->
      <g fill="#1E293B" stroke="#38BDF8" stroke-width="2.5">
        <rect x="245" y="390" width="85" height="110" rx="10" />
        <rect x="357" y="390" width="85" height="110" rx="10" fill="#0284C7" />
        <rect x="470" y="390" width="85" height="110" rx="10" />
      </g>
      <text x="287" y="455" fill="#F8FAFC" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">Z</text>
      <text x="400" y="455" fill="#F8FAFC" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">X</text>
      <text x="512" y="455" fill="#F8FAFC" font-size="18" font-family="monospace" font-weight="bold" text-anchor="middle">C</text>
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // O3C HALL EFFECT KEYPAD</text>
  </svg>