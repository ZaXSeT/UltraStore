<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#60A5FA" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// PULSAR</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">High Rear Arch Palm Grip</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <ellipse cx="400" cy="620" rx="150" ry="22" fill="#000000" fill-opacity="0.08" filter="blur(6px)" />

      <!-- Shell (High Hump Ergonomic Contour) -->
      <path d="M 400 165 C 315 165, 270 235, 270 395 C 270 520, 310 595, 400 595 C 490 595, 530 520, 530 395 C 530 235, 485 165, 400 165 Z"
            fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" />

      <!-- Ergonomic Hump Shading -->
      <ellipse cx="400" cy="460" rx="90" ry="85" fill="#F1F5F9" />

      <!-- Clicks Split -->
      <path d="M 400 165 L 400 320" stroke="#E2E8F0" stroke-width="3" />

      <!-- Scroll Wheel -->
      <rect x="388" y="210" width="24" height="60" rx="8" fill="#0F172A" stroke="#60A5FA" stroke-width="2.5" />
      <line x1="392" y1="230" x2="408" y2="230" stroke="#60A5FA" stroke-width="2" />
      <line x1="392" y1="245" x2="408" y2="245" stroke="#60A5FA" stroke-width="2" />
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // PULSAR X2H HIGH HUMP</text>
  </svg>