<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#E11D48" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// PADSMITH</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Premium Control Cloth Mousepad</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <rect x="160" y="550" width="480" height="30" rx="12" fill="#000000" fill-opacity="0.08" filter="blur(8px)" />

      <!-- Stitched Perimeter -->
      <rect x="150" y="210" width="500" height="380" rx="16" fill="#18181B" stroke="#BE123C" stroke-width="4" />

      <!-- Japanese Shrine Torii Gate Artwork -->
      <rect x="158" y="218" width="484" height="364" rx="10" fill="#27272A" />

      <!-- Rising Sun Red Circle -->
      <circle cx="400" cy="360" r="110" fill="#E11D48" />

      <!-- Mist / Cloud Shapes -->
      <ellipse cx="280" cy="460" rx="100" ry="30" fill="#3F3F46" opacity="0.7" />
      <ellipse cx="500" cy="480" rx="120" ry="35" fill="#3F3F46" opacity="0.7" />

      <!-- Torii Gate Silhouette -->
      <g fill="#09090B">
        <!-- Top Lintels -->
        <path d="M 280 270 Q 400 250 520 270 L 515 285 Q 400 270 285 285 Z" />
        <rect x="310" y="295" width="180" height="15" />
        <!-- Pillars -->
        <rect x="330" y="280" width="20" height="220" />
        <rect x="450" y="280" width="20" height="220" />
      </g>

      <!-- Padsmith Badge -->
      <text x="590" y="560" fill="#F43F5E" font-size="11" font-family="monospace" font-weight="bold" text-anchor="end">PADSMITH</text>
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // TEMPLE OF DREAMS</text>
  </svg>