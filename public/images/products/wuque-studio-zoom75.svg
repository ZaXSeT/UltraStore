<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#A855F7" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// WUQUE STUDIO</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">75% Gasket Mount + LCD Screen</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <rect x="140" y="550" width="520" height="40" rx="16" fill="#000000" fill-opacity="0.12" filter="blur(10px)" />

      <!-- Anodized Lilac/Navy Chassis -->
      <rect x="130" y="230" width="540" height="340" rx="18" fill="#1E1B4B" stroke="#4338CA" stroke-width="4" />
      <rect x="145" y="245" width="510" height="310" rx="10" fill="#0F172A" />

      <!-- Mini Color LCD Screen Badge Top-Right -->
      <rect x="585" y="260" width="60" height="45" rx="6" fill="#020617" stroke="#A855F7" stroke-width="2" />
      <rect x="592" y="268" width="46" height="29" rx="3" fill="#3B82F6" />
      <circle cx="615" cy="282" r="6" fill="#A855F7" />

      <!-- Rotary Encoder Knob -->
      <circle cx="550" cy="282" r="16" fill="#E2E8F0" stroke="#A855F7" stroke-width="3" />
      <circle cx="550" cy="282" r="8" fill="#475569" />

      <!-- 75% Keycap Grid Representation -->
      <g fill="#312E81" stroke="#1E1B4B" stroke-width="2">
        <!-- F-Row -->
        <rect x="155" y="260" width="28" height="30" rx="3" fill="#A855F7" />
        <rect x="190" y="260" width="28" height="30" rx="3" />
        <rect x="225" y="260" width="28" height="30" rx="3" />
        <rect x="260" y="260" width="28" height="30" rx="3" />
        <rect x="305" y="260" width="28" height="30" rx="3" />
        <rect x="340" y="260" width="28" height="30" rx="3" />
        <rect x="375" y="260" width="28" height="30" rx="3" />
        <rect x="410" y="260" width="28" height="30" rx="3" />
        <rect x="455" y="260" width="28" height="30" rx="3" />
        <rect x="490" y="260" width="28" height="30" rx="3" />

        <!-- Number Row -->
        <rect x="155" y="300" width="30" height="35" rx="3" />
        <rect x="190" y="300" width="30" height="35" rx="3" />
        <rect x="225" y="300" width="30" height="35" rx="3" />
        <rect x="260" y="300" width="30" height="35" rx="3" />
        <rect x="295" y="300" width="30" height="35" rx="3" />
        <rect x="330" y="300" width="30" height="35" rx="3" />
        <rect x="365" y="300" width="30" height="35" rx="3" />
        <rect x="400" y="300" width="30" height="35" rx="3" />
        <rect x="435" y="300" width="30" height="35" rx="3" />
        <rect x="470" y="300" width="30" height="35" rx="3" />
        <rect x="505" y="300" width="30" height="35" rx="3" />
        <rect x="540" y="300" width="55" height="35" rx="3" fill="#A855F7" />
        <rect x="605" y="315" width="40" height="35" rx="3" />

        <!-- Alpha Rows -->
        <rect x="155" y="345" width="42" height="35" rx="3" />
        <rect x="202" y="345" width="30" height="35" rx="3" />
        <rect x="237" y="345" width="30" height="35" rx="3" />
        <rect x="272" y="345" width="30" height="35" rx="3" />
        <rect x="307" y="345" width="30" height="35" rx="3" fill="#A855F7" />
        <rect x="342" y="345" width="30" height="35" rx="3" fill="#A855F7" />
        <rect x="377" y="345" width="30" height="35" rx="3" />
        <rect x="412" y="345" width="30" height="35" rx="3" />
        <rect x="447" y="345" width="30" height="35" rx="3" />
        <rect x="482" y="345" width="30" height="35" rx="3" />
        <rect x="517" y="345" width="78" height="35" rx="3" />
        <rect x="605" y="360" width="40" height="35" rx="3" />

        <!-- Spacebar Row -->
        <rect x="155" y="490" width="45" height="45" rx="3" />
        <rect x="205" y="490" width="40" height="45" rx="3" />
        <rect x="250" y="490" width="45" height="45" rx="3" />
        <rect x="300" y="490" width="220" height="45" rx="3" fill="#C084FC" stroke="#A855F7" stroke-width="2" />
        <rect x="525" y="490" width="40" height="45" rx="3" />
        <!-- Arrows -->
        <rect x="575" y="495" width="32" height="40" rx="3" fill="#A855F7" />
        <rect x="612" y="495" width="32" height="40" rx="3" fill="#A855F7" />
      </g>
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // ZOOM75 CUSTOM KEYBOARD</text>
  </svg>