      <rect x="165" y="255" width="470" height="290" rx="8" fill="#09090B" />

      <!-- Keycap Layout with Lekker Switch Yellow Highlights -->
      <g fill="#27272A" stroke="#18181B" stroke-width="2">
        <!-- Row 1 -->
        <rect x="175" y="270" width="32" height="40" rx="4" fill="#FACC15" />
        <rect x="212" y="270" width="32" height="40" rx="4" />
        <rect x="249" y="270" width="32" height="40" rx="4" />
        <rect x="286" y="270" width="32" height="40" rx="4" />
