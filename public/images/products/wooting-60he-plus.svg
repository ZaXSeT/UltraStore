        <rect x="555" y="320" width="70" height="40" rx="4" />

        <!-- Row 3 A-S-D -->
        <rect x="175" y="370" width="52" height="40" rx="4" />
        <rect x="232" y="370" width="32" height="40" rx="4" fill="#FACC15" />
        <rect x="269" y="370" width="32" height="40" rx="4" fill="#FACC15" />
        <rect x="306" y="370" width="32" height="40" rx="4" fill="#FACC15" />
        <rect x="343" y="370" width="32" height="40" rx="4" />
