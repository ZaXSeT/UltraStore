        <rect x="175" y="470" width="45" height="40" rx="4" />
        <rect x="225" y="470" width="38" height="40" rx="4" />
        <rect x="268" y="470" width="45" height="40" rx="4" />
        <rect x="318" y="470" width="220" height="40" rx="4" fill="#FACC15" stroke="#CA8A04" stroke-width="2" />
        <rect x="543" y="470" width="38" height="40" rx="4" />
