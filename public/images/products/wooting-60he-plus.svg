        <rect x="259" y="320" width="32" height="40" rx="4" fill="#FACC15" />
        <rect x="296" y="320" width="32" height="40" rx="4" />
        <rect x="333" y="320" width="32" height="40" rx="4" />
        <rect x="370" y="320" width="32" height="40" rx="4" />
        <rect x="407" y="320" width="32" height="40" rx="4" />
