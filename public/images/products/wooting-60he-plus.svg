      <rect x="100" y="320" width="80" height="35" rx="6" fill="#FACC15" stroke="#CA8A04" stroke-width="2" />
      <text x="140" y="342" fill="#000000" font-size="9" font-family="monospace" font-weight="900" text-anchor="middle">WOOTING</text>

