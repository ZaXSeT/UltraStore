<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#38BDF8" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// SENNHEISER</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Open-Back Reference Headphones</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <ellipse cx="400" cy="620" rx="160" ry="22" fill="#000000" fill-opacity="0.1" filter="blur(8px)" />

      <!-- Headband Arc (Marble Blue Finish) -->
      <path d="M 230 420 C 230 220, 310 160, 400 160 C 490 160, 570 220, 570 420"
            stroke="#1E3A8A" stroke-width="28" stroke-linecap="round" fill="none" />
      <!-- Headband Cushion Pads -->
      <rect x="330" y="166" width="60" height="16" rx="8" fill="#1E293B" />
      <rect x="410" y="166" width="60" height="16" rx="8" fill="#1E293B" />

      <!-- Left Earcup (Oval Open-Back Steel Honeycomb Mesh) -->
      <ellipse cx="230" cy="440" rx="55" ry="90" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
      <ellipse cx="230" cy="440" rx="45" ry="78" fill="#020617" />
      <!-- Left Steel Honeycomb Mesh -->
      <g stroke="#475569" stroke-width="1.5" opacity="0.6">
        <line x1="200" y1="390" x2="260" y2="490" />
        <line x1="200" y1="440" x2="260" y2="440" />
        <line x1="200" y1="490" x2="260" y2="390" />
      </g>
      <text x="230" y="445" fill="#38BDF8" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">HD 600</text>

      <!-- Right Earcup -->
      <ellipse cx="570" cy="440" rx="55" ry="90" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
      <ellipse cx="570" cy="440" rx="45" ry="78" fill="#020617" />
      <!-- Right Steel Honeycomb Mesh -->
      <g stroke="#475569" stroke-width="1.5" opacity="0.6">
        <line x1="540" y1="390" x2="600" y2="490" />
        <line x1="540" y1="440" x2="600" y2="440" />
        <line x1="540" y1="490" x2="600" y2="390" />
      </g>
      <text x="570" y="445" fill="#38BDF8" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">HD 600</text>
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // SENNHEISER HD 600</text>
  </svg>