<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#BE123C" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// ARTISAN</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Japanese Poron Base Wine Red</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <rect x="160" y="550" width="480" height="30" rx="12" fill="#000000" fill-opacity="0.08" filter="blur(8px)" />

      <!-- Edge Stitching FX Border -->
      <rect x="150" y="210" width="500" height="380" rx="16" fill="#881337" stroke="#BE123C" stroke-width="4" />

      <!-- Weave Texture (Wine Red Japanese Jacquard) -->
      <rect x="158" y="218" width="484" height="364" rx="10" fill="#4C0519" />

      <!-- Geometric Artisan Texture Weave Simulation -->
      <g stroke="#9F1239" stroke-width="1.5" opacity="0.4">
        <line x1="160" y1="260" x2="640" y2="260" />
        <line x1="160" y1="310" x2="640" y2="310" />
        <line x1="160" y1="360" x2="640" y2="360" />
        <line x1="160" y1="410" x2="640" y2="410" />
        <line x1="160" y1="460" x2="640" y2="460" />
        <line x1="160" y1="510" x2="640" y2="510" />
      </g>

      <!-- ARTISAN Iconic Inverted Triangle Logo -->
      <polygon points="580,245 610,245 595,275" fill="#BE123C" stroke="#F43F5E" stroke-width="2" />
      <text x="595" y="295" fill="#F43F5E" font-size="9" font-family="monospace" font-weight="bold" text-anchor="middle">ARTISAN</text>
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // HAYATE OTSU FX</text>
  </svg>