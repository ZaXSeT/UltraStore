<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Studio Background -->
    <rect width="800" height="800" fill="#FFFFFF" rx="24"/>
    <rect x="12" y="12" width="776" height="776" rx="16" stroke="#F1F5F9" stroke-width="2"/>

    <!-- Subtle Tech Coordinate Grid -->
    <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 8" opacity="0.6">
      <line x1="100" y1="0" x2="100" y2="800" />
      <line x1="700" y1="0" x2="700" y2="800" />
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="700" x2="800" y2="700" />
    </g>

    <!-- Brand Meta Header -->
    <g opacity="0.85">
      <rect x="40" y="40" width="8" height="8" rx="2" fill="#14B8A6" />
      <text x="56" y="48" fill="#0F172A" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1.5">// UNUSUAL WAY SPORTS</text>
      <text x="760" y="48" fill="#64748B" font-size="11" font-family="monospace" text-anchor="end">Silicate Acid-Etched Glass Surface</text>
    </g>

    <!-- Product Artwork -->
    
      <!-- Shadow -->
      <rect x="160" y="550" width="480" height="30" rx="14" fill="#000000" fill-opacity="0.1" filter="blur(8px)" />

      <!-- Frosted Glass Pad -->
      <rect x="150" y="210" width="500" height="380" rx="18" fill="#0F172A" stroke="#14B8A6" stroke-width="4" />

      <!-- High Tech Grid & Crosshairs Pattern -->
      <g stroke="#14B8A6" stroke-width="1" opacity="0.3">
        <line x1="150" y1="305" x2="650" y2="305" />
        <line x1="150" y1="400" x2="650" y2="400" />
        <line x1="150" y1="495" x2="650" y2="495" />
        <line x1="275" y1="210" x2="275" y2="590" />
        <line x1="400" y1="210" x2="400" y2="590" stroke-width="2" opacity="0.6" />
        <line x1="525" y1="210" x2="525" y2="590" />
      </g>

      <!-- Center Target Crosshair -->
      <circle cx="400" cy="400" r="45" stroke="#14B8A6" stroke-width="2" fill="none" />
      <circle cx="400" cy="400" r="15" fill="#14B8A6" fill-opacity="0.3" />
      <circle cx="400" cy="400" r="3" fill="#14B8A6" />

      <!-- Glass Specular Reflection Highlight -->
      <path d="M 180 230 L 350 230 L 230 450 L 180 450 Z" fill="#FFFFFF" opacity="0.1" />
    

    <!-- Corner Framing Target Markers -->
    <path d="M 40 60 L 40 40 L 60 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 60 L 760 40 L 740 40" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 40 740 L 40 760 L 60 760" stroke="#CBD5E1" stroke-width="2" fill="none" />
    <path d="M 760 740 L 760 760 L 740 760" stroke="#CBD5E1" stroke-width="2" fill="none" />

    <!-- Authentic Model Watermark -->
    <text x="400" y="750" fill="#94A3B8" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle" letter-spacing="2">ULTRASTORE VERIFIED GEAR // SPEED GLASS GAMING PAD</text>
  </svg>